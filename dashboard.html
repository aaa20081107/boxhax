<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BoxHax — 團隊驗證碼共享面板</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --ok: #2ecc71;
    --warn: #f1c40f;
    --err: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #232833;
    color: var(--muted);
  }
  .badge.enterprise { background: #1e3a5f; color: #7fb3ff; }
  .badge.community { background: #2a2f3a; color: var(--muted); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .row { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    padding: 10px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled {
    background: #2a2f3a;
    color: #5a6172;
    cursor: not-allowed;
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.danger {
    background: transparent;
    border: 1px solid #5a2a2a;
    color: var(--err);
  }
  button.small { padding: 6px 10px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 8px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .item .code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--ok);
  }
  .item .meta {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--err); font-size: 13px; margin-top: 8px; }
  .locked { opacity: 0.5; cursor: not-allowed; }
  .flex-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hidden { display: none !important; }

  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 380px;
  }
  .login-box h1 {
    font-size: 20px;
    margin: 0 0 6px;
    text-align: center;
  }
  .login-box .sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<!-- 登入頁 -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-box">
    <h1>BoxHax</h1>
    <div class="sub">請輸入管理員帳密</div>
    <div class="row">
      <label>帳號</label>
      <input id="loginUser" type="text" autocomplete="username" />
    </div>
    <div class="row">
      <label>密碼</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
    </div>
    <button id="loginBtn" style="width:100%">登入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 主面板 -->
<div id="mainView" class="hidden">
  <header>
    <h1>BoxHax</h1>
    <div class="btn-row">
      <span id="editionBadge" class="badge">載入中…</span>
      <button class="ghost small" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="wrap">

    <div class="panel">
      <h2>版本狀態</h2>
      <div class="flex-between">
        <div>
          <div id="editionText">檢查中…</div>
          <div class="hint" id="expiryText"></div>
        </div>
        <button class="ghost small" id="refreshLicenseBtn">重新檢查</button>
      </div>
      <div class="err" id="licenseErr"></div>
    </div>

    <div class="panel">
      <h2>團隊管理</h2>
      <div class="btn-row">
        <button id="addGroupBtn">新增團隊</button>
        <button class="ghost" id="loadGroupsBtn">重新載入</button>
      </div>
      <div class="hint" id="groupLimitHint"></div>
      <div id="groupsList" class="list"></div>
    </div>

    <div class="panel">
      <h2>驗證碼即時串流</h2>
      <div class="flex-between">
        <select id="codeGroupFilter" style="max-width:240px">
          <option value="">全部團隊</option>
        </select>
        <button class="ghost small" id="refreshCodesBtn">重新整理</button>
      </div>
      <div id="codesList" class="list">
        <div class="empty">尚無驗證碼</div>
      </div>
    </div>

    <div class="panel">
      <h2>網域管理</h2>
      <div class="btn-row">
        <button id="addDomainBtn">新增網域</button>
        <button class="ghost" id="loadDomainsBtn">重新載入</button>
      </div>
      <div class="hint" id="domainLimitHint"></div>
      <div id="domainsList" class="list"></div>
    </div>

    <div class="panel">
      <h2>LINE 推播設定</h2>
      <div class="btn-row">
        <button id="addLineBtn">新增綁定</button>
        <button class="ghost" id="loadLineBtn">重新載入</button>
      </div>
      <div class="hint" id="lineLimitHint"></div>
      <div id="lineList" class="list"></div>
    </div>

  </div>
</div>

<!-- 成員管理 Modal -->
<div class="modal-bg" id="membersModal">
  <div class="modal">
    <h3 id="membersModalTitle">成員管理</h3>
    <div class="row">
      <label>成員名稱</label>
      <input id="memberName" type="text" placeholder="例如：小明" />
    </div>
    <div class="row">
      <label>權限</label>
      <select id="memberRole">
        <option value="member">成員</option>
        <option value="admin">管理員</option>
        <option value="viewer">檢視者</option>
      </select>
    </div>
    <div class="btn-row">
      <button id="addMemberBtn">新增成員</button>
      <button class="ghost" id="closeMembersBtn">關閉</button>
    </div>
    <div class="err" id="memberErr"></div>
    <div id="membersList" class="list"></div>
  </div>
</div>

<!-- LINE 新增 Modal -->
<div class="modal-bg" id="lineModal">
  <div class="modal">
    <h3>新增 LINE 綁定</h3>
    <div class="row">
      <label>綁定團隊（可留空 = 預設）</label>
      <select id="lineGroupSelect">
        <option value="">預設群組</option>
      </select>
    </div>
    <div class="row">
      <label>顯示名稱</label>
      <input id="lineLabel" type="text" placeholder="例如：家庭群" />
    </div>
    <div class="row">
      <label>LINE Group ID</label>
      <input id="lineGroupId" type="text" placeholder="Cxxxxxxxx..." />
    </div>
    <div class="row">
      <label>Channel Access Token</label>
      <input id="lineToken" type="password" placeholder="貼上 Token" />
    </div>
    <div class="btn-row">
      <button id="lineSaveBtn">儲存</button>
      <button class="ghost" id="lineCancelBtn">取消</button>
    </div>
    <div class="err" id="lineErr"></div>
  </div>
</div>

<!-- 網域新增 Modal -->
<div class="modal-bg" id="domainModal">
  <div class="modal">
    <h3>新增網域</h3>
    <div class="row">
      <label>所屬團隊</label>
      <select id="domainGroupSelect"></select>
    </div>
    <div class="row">
      <label>網域</label>
      <input id="domainInput" type="text" placeholder="例如 inbox.example.com" />
    </div>
    <div class="btn-row">
      <button id="domainSaveBtn">儲存</button>
      <button class="ghost" id="domainCancelBtn">取消</button>
    </div>
    <div class="err" id="domainErr"></div>
  </div>
</div>

<script>
// ============================================================
// 設定：Worker 的網址
// ============================================================
const WORKER_URL = 'https://boxhax.aaa20081107.workers.dev';

const API = {
  me: WORKER_URL + '/api/me',
  login: WORKER_URL + '/api/login',
  logout: WORKER_URL + '/api/logout',
  license: WORKER_URL + '/api/license',
  groups: WORKER_URL + '/api/groups',
  codes: WORKER_URL + '/api/codes',
  domains: WORKER_URL + '/api/domains',
  line: WORKER_URL + '/api/line'
};

const state = {
  edition: 'community',
  groups: [],
  codes: [],
  domains: [],
  lines: [],
  currentGroupId: null
};

const $ = (id) => document.getElementById(id);

async function apiGet(path) {
  const res = await fetch(path, { credentials: 'include' });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiSend(path, method, body) {
  const res = await fetch(path, {
    method,
    credentials: 'include',
    headers: { 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function showLogin() {
  $('loginView').classList.remove('hidden');
  $('mainView').classList.add('hidden');
}

function showMain() {
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
}

async function doLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  $('loginErr').textContent = '';

  if (!username || !password) {
    $('loginErr').textContent = '請輸入帳號與密碼。';
    return;
  }

  try {
    const res = await fetch(API.login, {
      method: 'POST',
      credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      $('loginErr').textContent = data.error || '登入失敗';
      return;
    }
    $('loginPass').value = '';
    await initMain();
  } catch (e) {
    $('loginErr').textContent = '登入失敗：' + e.message;
  }
}

async function doLogout() {
  try { await fetch(API.logout, { method: 'POST', credentials: 'include' }); } catch (_) {}
  showLogin();
}

function renderEdition(data) {
  const badge = $('editionBadge');
  const text = $('editionText');
  const expiry = $('expiryText');
  const err = $('licenseErr');
  err.textContent = '';

  if (data.edition === 'enterprise') {
    badge.textContent = '商業續租版';
    badge.className = 'badge enterprise';
    text.textContent = '商業續租版已啟用';
    expiry.textContent = data.expiresAt
      ? '到期時間：' + new Date(data.expiresAt).toISOString()
      : '';
  } else {
    badge.textContent = '社群免費版';
    badge.className = 'badge community';
    text.textContent = '社群免費版';
    expiry.textContent = '限制：1 個團隊、5 名成員、1 個網域、1 組 LINE';
    if (data.reason) err.textContent = '序號驗證未通過（' + data.reason + '）';
  }

  state.edition = data.edition;
  applyLimits();
}

function applyLimits() {
  const isEnt = state.edition === 'enterprise';
  const addGroup = $('addGroupBtn');
  const addDomain = $('addDomainBtn');
  const addLine = $('addLineBtn');

  addGroup.disabled = !isEnt && state.groups.length >= 1;
  addDomain.disabled = !isEnt && state.domains.length >= 1;
  addLine.disabled = !isEnt && state.lines.length >= 1;

  addGroup.classList.toggle('locked', addGroup.disabled);
  addDomain.classList.toggle('locked', addDomain.disabled);
  addLine.classList.toggle('locked', addLine.disabled);

  $('groupLimitHint').textContent = isEnt
    ? '商業版：團隊數量無限制。'
    : '免費版：僅限 1 個團隊，最多 5 名成員。';
  $('domainLimitHint').textContent = isEnt
    ? '商業版：網域數量無限制。'
    : '免費版：僅限 1 個網域。';
  $('lineLimitHint').textContent = isEnt
    ? '商業版：LINE 綁定數量無限制，可分流。'
    : '免費版：僅限 1 組 LINE 綁定。';
}

function renderGroups() {
  const list = $('groupsList');
  list.innerHTML = '';
  const filter = $('codeGroupFilter');
  filter.innerHTML = '<option value="">全部團隊</option>';

  if (!state.groups.length) {
    list.innerHTML = '<div class="empty">尚無團隊</div>';
    applyLimits();
    return;
  }

  state.groups.forEach(g => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div>
        <div><b>${escapeHtml(g.name)}</b></div>
        <div class="meta">${g.slug || ''}</div>
      </div>
      <div class="meta">${g.memberCount || 0} 名成員</div>
      <div class="btn-row">
        <button class="ghost small" data-act="members" data-id="${g.id}">成員</button>
        <button class="ghost small" data-act="rename" data-id="${g.id}">改名</button>
        <button class="danger small" data-act="delete" data-id="${g.id}">刪除</button>
      </div>
    `;
    list.appendChild(el);

    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    filter.appendChild(opt);
  });

  applyLimits();
}

async function addGroup() {
  const name = prompt('請輸入團隊名稱：');
  if (!name) return;
  try {
    await apiSend(API.groups, 'POST', { name });
    await loadGroups();
  } catch (e) { alert('新增失敗：' + e.message); }
}

async function deleteGroup(id) {
  if (!confirm('確定要刪除此團隊？相關成員與驗證碼也會一併刪除。')) return;
  try {
    await apiSend(API.groups + '/' + id, 'DELETE');
    await loadGroups();
    await loadCodes();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

async function renameGroup(id) {
  const g = state.groups.find(x => String(x.id) === String(id));
  const name = prompt('新名稱：', g ? g.name : '');
  if (!name) return;
  try {
    await apiSend(API.groups + '/' + id, 'PATCH', { name });
    await loadGroups();
  } catch (e) { alert('改名失敗：' + e.message); }
}

async function openMembers(groupId) {
  state.currentGroupId = groupId;
  const g = state.groups.find(x => String(x.id) === String(groupId));
  $('membersModalTitle').textContent = '成員管理 — ' + (g ? g.name : '');
  $('memberErr').textContent = '';
  $('membersModal').classList.add('show');
  await loadMembers(groupId);
}

async function loadMembers(groupId) {
  const list = $('membersList');
  list.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const data = await apiGet(API.groups + '/' + groupId + '/members');
    const members = data.members || [];
    list.innerHTML = '';
    if (!members.length) {
      list.innerHTML = '<div class="empty">尚無成員</div>';
      return;
    }
    members.forEach(m => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div>
          <div><b>${escapeHtml(m.display_name)}</b></div>
          <div class="meta">${m.role}</div>
        </div>
        <button class="danger small" data-mid="${m.id}">刪除</button>
      `;
      list.appendChild(el);
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">載入失敗</div>';
  }
}

async function addMember() {
  const name = $('memberName').value.trim();
  const role = $('memberRole').value;
  $('memberErr').textContent = '';
  if (!name) { $('memberErr').textContent = '請輸入成員名稱。'; return; }
  try {
    await apiSend(API.groups + '/' + state.currentGroupId + '/members', 'POST', {
      display_name: name, role
    });
    $('memberName').value = '';
    await loadMembers(state.currentGroupId);
    await loadGroups();
  } catch (e) {
    $('memberErr').textContent = '新增失敗：' + e.message;
  }
}

async function deleteMember(id) {
  if (!confirm('確定刪除此成員？')) return;
  try {
    await apiSend(WORKER_URL + '/api/members/' + id, 'DELETE');
    await loadMembers(state.currentGroupId);
    await loadGroups();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

function renderCodes() {
  const list = $('codesList');
  list.innerHTML = '';
  if (!state.codes.length) {
    list.innerHTML = '<div class="empty">尚無驗證碼</div>';
    return;
  }
  state.codes.forEach(c => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="code">${escapeHtml(c.code)}</div>
      <div class="meta">
        ${escapeHtml(c.sender || '未知寄件者')}<br>
        ${new Date(c.received_at).toLocaleString()}<br>
        ${c.is_used ? '已使用' : '未使用'}
      </div>
      <div class="btn-row">
        <button class="ghost small" data-act="used" data-id="${c.id}">標記已用</button>
        <button class="danger small" data-act="delete" data-id="${c.id}">刪除</button>
      </div>
    `;
    list.appendChild(el);
  });
}

async function deleteCode(id) {
  if (!confirm('確定刪除此驗證碼？')) return;
  try {
    await apiSend(API.codes + '/' + id, 'DELETE');
    await loadCodes();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

async function markCodeUsed(id) {
  try {
    await apiSend(API.codes + '/' + id + '/used', 'POST');
    await loadCodes();
  } catch (e) { alert('操作失敗：' + e.message); }
}

function renderDomains() {
  const list = $('domainsList');
  list.innerHTML = '';
  if (!state.domains.length) {
    list.innerHTML = '<div class="empty">尚無網域</div>';
    return;
  }
  state.domains.forEach(d => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div>
        <div><b>${escapeHtml(d.domain)}</b></div>
        <div class="meta">團隊 ID：${d.group_id}</div>
      </div>
      <button class="danger small" data-did="${d.id}">刪除</button>
    `;
    list.appendChild(el);
  });
}

function openDomainModal() {
  const sel = $('domainGroupSelect');
  sel.innerHTML = '';
  state.groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });
  $('domainErr').textContent = '';
  $('domainInput').value = '';
  $('domainModal').classList.add('show');
}

async function saveDomain() {
  const group_id = $('domainGroupSelect').value;
  const domain = $('domainInput').value.trim();
  $('domainErr').textContent = '';
  if (!domain) { $('domainErr').textContent = '請輸入網域。'; return; }
  try {
    await apiSend(API.domains, 'POST', { domain, group_id });
    $('domainModal').classList.remove('show');
    await loadDomains();
  } catch (e) {
    $('domainErr').textContent = '儲存失敗：' + e.message;
  }
}

async function deleteDomain(id) {
  if (!confirm('確定刪除此網域？')) return;
  try {
    await apiSend(API.domains + '/' + id, 'DELETE');
    await loadDomains();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

function renderLines() {
  const list = $('lineList');
  list.innerHTML = '';
  if (!state.lines.length) {
    list.innerHTML = '<div class="empty">尚無 LINE 綁定</div>';
    return;
  }
  state.lines.forEach(l => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div>
        <div><b>${escapeHtml(l.label || '未命名')}</b></div>
        <div class="meta">${escapeHtml(l.line_group_id)}</div>
      </div>
      <div class="meta">${l.is_default ? '預設' : '團隊專屬'}</div>
      <button class="danger small" data-lid="${l.id}">刪除</button>
    `;
    list.appendChild(el);
  });
}

function openLineModal() {
  const sel = $('lineGroupSelect');
  sel.innerHTML = '<option value="">預設群組</option>';
  state.groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });
  $('lineLabel').value = '';
  $('lineGroupId').value = '';
  $('lineToken').value = '';
  $('lineErr').textContent = '';
  $('lineModal').classList.add('show');
}

async function saveLine() {
  const group_id = $('lineGroupSelect').value || null;
  const label = $('lineLabel').value.trim();
  const line_group_id = $('lineGroupId').value.trim();
  const channel_token = $('lineToken').value.trim();
  $('lineErr').textContent = '';

  if (!line_group_id) { $('lineErr').textContent = '請輸入 LINE Group ID。'; return; }
  if (!channel_token) { $('lineErr').textContent = '請輸入 Token。'; return; }

  try {
    await apiSend(API.line, 'POST', { group_id, label, line_group_id, channel_token });
    $('lineModal').classList.remove('show');
    await loadLines();
  } catch (e) {
    $('lineErr').textContent = '儲存失敗：' + e.message;
  }
}

async function deleteLine(id) {
  if (!confirm('確定刪除此 LINE 綁定？')) return;
  try {
    await apiSend(API.line + '/' + id, 'DELETE');
    await loadLines();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

async function loadLicense() {
  try {
    const data = await apiGet(API.license);
    renderEdition(data);
  } catch (e) {
    $('editionText').textContent = '無法取得版本資訊';
    $('licenseErr').textContent = e.message;
  }
}

async function loadGroups() {
  try {
    const data = await apiGet(API.groups);
    state.groups = data.groups || [];
    renderGroups();
  } catch (e) {
    state.groups = [];
    renderGroups();
  }
}

async function loadCodes() {
  try {
    const gid = $('codeGroupFilter').value;
    const path = gid ? API.codes + '?group_id=' + gid : API.codes;
    const data = await apiGet(path);
    state.codes = data.codes || [];
    renderCodes();
  } catch (e) {
    state.codes = [];
    renderCodes();
  }
}

async function loadDomains() {
  try {
    const data = await apiGet(API.domains);
    state.domains = data.domains || [];
    renderDomains();
    applyLimits();
  } catch (e) {
    state.domains = [];
    renderDomains();
  }
}

async function loadLines() {
  try {
    const data = await apiGet(API.line);
    state.lines = data.bindings || [];
    renderLines();
    applyLimits();
  } catch (e) {
    state.lines = [];
    renderLines();
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function initMain() {
  showMain();
  await loadLicense();
  await loadGroups();
  await loadCodes();
  await loadDomains();
  await loadLines();

  setInterval(loadCodes, 10000);
}

async function bootstrap() {
  try {
    const me = await apiGet(API.me);
    if (me.loggedIn) await initMain();
    else showLogin();
  } catch (_) {
    showLogin();
  }
}

$('loginBtn').addEventListener('click', doLogin);
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('logoutBtn').addEventListener('click', doLogout);

$('refreshLicenseBtn').addEventListener('click', loadLicense);
$('addGroupBtn').addEventListener('click', addGroup);
$('loadGroupsBtn').addEventListener('click', loadGroups);
$('refreshCodesBtn').addEventListener('click', loadCodes);
$('codeGroupFilter').addEventListener('change', loadCodes);

$('addDomainBtn').addEventListener('click', openDomainModal);
$('loadDomainsBtn').addEventListener('click', loadDomains);
$('domainSaveBtn').addEventListener('click', saveDomain);
$('domainCancelBtn').addEventListener('click', () => $('domainModal').classList.remove('show'));

$('addLineBtn').addEventListener('click', openLineModal);
$('loadLineBtn').addEventListener('click', loadLines);
$('lineSaveBtn').addEventListener('click', saveLine);
$('lineCancelBtn').addEventListener('click', () => $('lineModal').classList.remove('show'));

$('addMemberBtn').addEventListener('click', addMember);
$('closeMembersBtn').addEventListener('click', () => $('membersModal').classList.remove('show'));

document.addEventListener('click', (e) => {
  const t = e.target;
  if (!t || !t.dataset) return;

  if (t.dataset.act === 'members') openMembers(t.dataset.id);
  if (t.dataset.act === 'rename') renameGroup(t.dataset.id);
  if (t.dataset.act === 'delete' && t.closest('#groupsList')) deleteGroup(t.dataset.id);
  if (t.dataset.act === 'delete' && t.closest('#codesList')) deleteCode(t.dataset.id);
  if (t.dataset.act === 'used') markCodeUsed(t.dataset.id);
  if (t.dataset.mid) deleteMember(t.dataset.mid);
  if (t.dataset.did) deleteDomain(t.dataset.did);
  if (t.dataset.lid) deleteLine(t.dataset.lid);
});

bootstrap();
</script>
</body>
</html>
